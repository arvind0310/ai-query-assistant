# Local, production-like run of both containers:  docker compose up --build
# Then open http://localhost:8080
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
